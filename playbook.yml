# ============================================================
# Playbook: MGW Audit Alert (AWX) - PHUONG AN 1
# Ansible TU SSH vao McAfee/Trellix Web Gateway lay audit log
# (dung paramiko => KHONG can sshpass tren EE), roi chay
# scripts/collect_audit.py --from-file de parse + gui Telegram.
#
# Credential: 1 bien "secret_data" (AWX Credential/Extra Vars), cau truc:
#   secret_data:
#     telegram_bot_token: "123456:ABC..."
#     telegram_chat_id:   "-100..."
#     mgw:
#       host: "10.4.255.98"
#       user: "pci-dss"
#       password: "***"
#       port: 22
#
# Yeu cau EE: python3 + ansible paramiko (co san). KHONG can sshpass/plink.
# Code Python chi dung stdlib.
# ============================================================

- name: MGW Audit Alert - lay log + gui canh bao Telegram
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}"
    python_bin: "python3"
    secret_file: "{{ playbook_dir }}/config/secret.json"
    raw_log_file: "{{ playbook_dir }}/logs/mgw_audit_raw.log"
    remote_dir: "/opt/mwg/log/audit"
    remote_pattern: "audit*.log"

  tasks:
    - name: Kiem tra python3
      ansible.builtin.command: "{{ python_bin }} --version"
      register: py_check
      changed_when: false

    - name: Kiem tra secret_data da duoc gan vao Job Template
      ansible.builtin.assert:
        that:
          - secret_data is defined
          - secret_data.telegram_bot_token is defined
          - secret_data.telegram_bot_token | length > 0
          - secret_data.mgw is defined
          - secret_data.mgw.host is defined
          - secret_data.mgw.password is defined
        fail_msg: >-
          Thieu 'secret_data'. Gan Credential/Extra Vars chua
          telegram_bot_token, telegram_chat_id va mgw{host,user,password,port}.

    # Ghi secret.json (chi telegram - script doc token/chat tu day; mgw lay qua Ansible).
    - name: Sinh config/secret.json tu secret_data
      ansible.builtin.copy:
        content: >-
          {{ {
               'mgw': secret_data.mgw,
               'telegram': {
                 'bot_token': secret_data.telegram_bot_token,
                 'chat_id': secret_data.telegram_chat_id | default('')
               }
             } | to_nice_json }}
        dest: "{{ secret_file }}"
        mode: '0600'
      no_log: true

    # Them MGW vao inventory runtime. paramiko = xu ly password thuan Python,
    # KHONG can sshpass tren EE.
    - name: Them host MGW vao inventory runtime
      ansible.builtin.add_host:
        name: mgw_target
        ansible_host: "{{ secret_data.mgw.host }}"
        ansible_user: "{{ secret_data.mgw.user | default('pci-dss') }}"
        ansible_password: "{{ secret_data.mgw.password }}"
        ansible_port: "{{ secret_data.mgw.port | default(22) }}"
        ansible_connection: paramiko
        ansible_paramiko_look_for_keys: false
        ansible_host_key_checking: false
        ansible_python_interpreter: /usr/bin/python
      no_log: true

- name: Lay audit log tu MGW
  hosts: mgw_target
  gather_facts: false

  tasks:
    # cat tat ca audit*.log; loc ngay o tang Python (collect_audit --today).
    # raw = ansible.builtin.raw -> KHONG can python tren MGW.
    - name: Cat audit log tren MGW
      ansible.builtin.raw: "cat /opt/mwg/log/audit/audit*.log 2>/dev/null"
      register: mgw_raw
      changed_when: false
      failed_when: false

- name: Parse + gui Telegram
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}"
    python_bin: "python3"
    raw_log_file: "{{ playbook_dir }}/logs/mgw_audit_raw.log"
    # Chi alert thay doi trong N phut gan nhat. Dat = chu ky AWX Schedule
    # (vd Schedule chay moi 10' -> window_minutes: 10). Khong co thay doi
    # trong cua so nay -> KHONG alert.
    window_minutes: 10

  tasks:
    - name: Lay raw log tu play truoc
      ansible.builtin.set_fact:
        mgw_audit_raw: "{{ hostvars['mgw_target']['mgw_raw'].stdout | default('') }}"
        mgw_audit_rc: "{{ hostvars['mgw_target']['mgw_raw'].rc | default(1) }}"

    - name: Canh bao Telegram neu KHONG lay duoc log tu MGW
      ansible.builtin.command:
        cmd: >-
          {{ python_bin }} {{ project_dir }}/scripts/notify_system_error.py
          "{{ secret_data.mgw.host }}" "{{ mgw_audit_rc }}"
        chdir: "{{ project_dir }}/scripts"
      when: (mgw_audit_rc | int != 0) or (mgw_audit_raw | length == 0)
      changed_when: false
      failed_when: false

    - name: Dung lai neu khong co log
      ansible.builtin.fail:
        msg: "Khong lay duoc audit log tu MGW (rc={{ mgw_audit_rc }}, bytes={{ mgw_audit_raw | length }}). Da gui alert Telegram."
      when: (mgw_audit_rc | int != 0) or (mgw_audit_raw | length == 0)

    - name: Dam bao thu muc logs ton tai
      ansible.builtin.file:
        path: "{{ project_dir }}/logs"
        state: directory
        mode: '0700'

    - name: Ghi raw log ra file tam
      ansible.builtin.copy:
        content: "{{ mgw_audit_raw }}"
        dest: "{{ raw_log_file }}"
        mode: '0600'
      no_log: true

    - name: Chay MGW audit alert (--from-file, cua so {{ window_minutes }}')
      ansible.builtin.command:
        cmd: >-
          {{ python_bin }} {{ project_dir }}/scripts/collect_audit.py
          --alert --window {{ window_minutes }} --from-file {{ raw_log_file }}
        chdir: "{{ project_dir }}/scripts"
      register: result
      changed_when: "'Đã gửi' in result.stdout"
      failed_when: false
      environment:
        PYTHONUNBUFFERED: "1"
        TZ: "Asia/Ho_Chi_Minh"

    - name: Output (stdout + stderr de chan doan)
      ansible.builtin.debug:
        msg:
          - "rc = {{ result.rc | default('?') }}"
          - "--- STDOUT ---"
          - "{{ result.stdout_lines | default([]) }}"
          - "--- STDERR ---"
          - "{{ result.stderr_lines | default([]) }}"

    - name: Xoa raw log tam (tranh luu log tren disk EE)
      ansible.builtin.file:
        path: "{{ raw_log_file }}"
        state: absent

    # Script tra ve so tin da gui (rc = so tin, vd rc=6) tren ban cu, hoac
    # rc=0 tren ban moi. Chi coi la LOI khi stdout bao loi doc log ("Khong doc
    # duoc") hoac khong co dong "Da gui"/"cần cảnh báo". Tranh fail nham khi
    # da gui alert thanh cong.
    - name: Bao fail neu script loi THUC SU
      ansible.builtin.fail:
        msg: "collect_audit.py loi (rc={{ result.rc }}). Xem Output o tren."
      when: >-
        ('Không đọc được' in (result.stdout | default('')))
        or ('Thiếu Telegram' in (result.stdout | default('')))
        or (result.stdout | default('') | length == 0)

    # Luu y: dedup state logs/seen_*.json chi hieu luc neu AWX mount persistent
    # volume vao {{ project_dir }}/logs. Neu khong, moi lan chay coi tat ca la moi.
    - name: Luu y dedup state
      ansible.builtin.debug:
        msg: >-
          Neu AWX khong mount persistent volume vao {{ project_dir }}/logs,
          dedup se reset moi lan chay (co the gui trung). Can mount volume de giu seen_*.json.
