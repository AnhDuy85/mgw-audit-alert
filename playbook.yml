# ============================================================
# Playbook: MGW Audit Alert (AWX)
# Mục đích : SSH vào McAfee/Trellix Web Gateway lấy audit log,
#            lọc thay đổi cấu hình (ADD/DELETE/MODIFIED content,
#            MODIFIED rule) và gửi cảnh báo Telegram.
#            Chạy định kỳ qua AWX Schedule (vd mỗi 1 phút).
#
# Credential: dùng 1 biến "secret_data" (AWX Credential/Extra Vars),
# KHÔNG commit, cấu trúc:
#   secret_data:
#     telegram_bot_token: "123456:ABC..."
#     telegram_chat_id:   "-100..."
#     mgw:
#       host: "10.4.255.98"
#       user: "pci-dss"
#       password: "***"
#       port: 22
#
# Playbook ghi secret_data ra config/secret.json luc runtime roi chay
# scripts/collect_audit.py (script tu doc secret.json).
#
# Yêu cầu: AWX EE có python3 + sshpass (dùng password) hoặc SSH key.
#          Code Python chỉ dùng stdlib (không pip).
# ============================================================

- name: MGW Audit Alert - gui canh bao thay doi cau hinh ra Telegram
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_dir: "{{ playbook_dir }}"
    python_bin: "python3"
    secret_file: "{{ playbook_dir }}/config/secret.json"
    # today = chỉ thay đổi trong ngày (khuyến nghị). all = mọi ngày.
    scan_scope: "today"
    # EE Linux: dùng sshpass (cần EE có sshpass). Hoặc đặt ssh_key_path.
    use_sshpass: true
    ssh_key_path: ""

  tasks:
    - name: Kiem tra python3
      ansible.builtin.command: "{{ python_bin }} --version"
      register: py_check
      changed_when: false

    - name: Kiem tra secret_data da duoc gan vao Job Template
      ansible.builtin.assert:
        that:
          - secret_data is defined
          - secret_data.telegram_bot_token is defined
          - secret_data.telegram_bot_token | length > 0
          - secret_data.mgw is defined
          - secret_data.mgw.host is defined
          - secret_data.mgw.password is defined
        fail_msg: >-
          Thieu 'secret_data'. Gan Credential/Extra Vars chua
          telegram_bot_token, telegram_chat_id va mgw{host,user,password,port}.

    # Ghi secret.json tu secret_data (mode 0600, no_log de khong lo secret).
    - name: Sinh config/secret.json tu secret_data
      ansible.builtin.copy:
        content: >-
          {{ {
               'mgw': secret_data.mgw,
               'telegram': {
                 'bot_token': secret_data.telegram_bot_token,
                 'chat_id': secret_data.telegram_chat_id | default('')
               }
             } | to_nice_json }}
        dest: "{{ secret_file }}"
        mode: '0600'
      no_log: true

    - name: Build tham so
      ansible.builtin.set_fact:
        scope_flag: "{{ '--today' if scan_scope == 'today' else '--all-days' }}"
        key_flag: "{{ ('--key ' + ssh_key_path) if (ssh_key_path | length > 0) else '' }}"
        sshpass_flag: "{{ '--sshpass' if (use_sshpass | bool and ssh_key_path | length == 0) else '' }}"

    # Chay 1 lan (--alert). AWX Schedule dinh ky thay cho --loop.
    # Script doc host/user/password/telegram tu secret.json vua sinh.
    - name: Chay MGW audit alert
      ansible.builtin.command:
        cmd: >-
          {{ python_bin }} {{ project_dir }}/scripts/collect_audit.py
          --alert {{ scope_flag }} {{ key_flag }} {{ sshpass_flag }}
        chdir: "{{ project_dir }}/scripts"
      register: result
      changed_when: "'Đã gửi' in result.stdout"
      # KHONG fail cung: script tu gui alert loi Telegram khi SSH fail; ta can
      # thay output chan doan (rc/hint) o task Output ben duoi.
      failed_when: false
      environment:
        PYTHONUNBUFFERED: "1"
        TZ: "Asia/Ho_Chi_Minh"

    - name: Output (stdout + stderr de chan doan)
      ansible.builtin.debug:
        msg:
          - "rc = {{ result.rc | default('?') }}"
          - "--- STDOUT ---"
          - "{{ result.stdout_lines | default([]) }}"
          - "--- STDERR ---"
          - "{{ result.stderr_lines | default([]) }}"

    - name: Bao fail neu script loi
      ansible.builtin.fail:
        msg: "collect_audit.py tra rc={{ result.rc }}. Xem Output o tren de biet nguyen nhan."
      when: result.rc | default(1) != 0

    # Doc dedup state (seen_*.json) khong persistent giua cac lan chay AWX ->
    # moi lan chay se coi tat ca la "moi". De tranh gui trung, hoac:
    #   (a) mount persistent volume vao logs/, HOAC
    #   (b) chap nhan: dung --today + AWX chay 1 phut/lan, dedup trong ngay
    #       chi hieu luc neu logs/ persistent.
    # Neu logs/ KHONG persistent, nen c.n nhac dung --loop tren 1 host co dinh.
    - name: Luu y dedup state
      ansible.builtin.debug:
        msg: >-
          Neu AWX khong mount persistent volume vao {{ project_dir }}/logs,
          dedup se reset moi lan chay. Can mount volume hoac chay --loop tren host co dinh.
